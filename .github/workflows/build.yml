name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core behavior checks
        run: dotnet run --project tests/MouseMoverApp.Checks -c Release -- --core
      - name: Build
        run: dotnet build -c Release
      - name: Publish standalone EXE
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MouseMoverApp-win-x64
          path: |
            artifacts/release/MouseMoverApp.exe
            artifacts/SHA256SUMS.txt
